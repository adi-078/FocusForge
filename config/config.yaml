# FocusForge v2 config

app:
  host: "127.0.0.1"
  port: 8765
  debug: false

camera:
  device_id: 0
  fps_face: 30
  fps_pose: 10
  fps_hands: 15
  frame_width: 640
  frame_height: 480
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.6

calibration:
  duration_seconds: 30
  required_frames: 200

thresholds:
  yaw_switch_threshold: 25.0
  pitch_distraction_threshold: 20.0
  gaze_drift_threshold: 0.3
  gaze_instability_window: 2.0
  risk_medium: 0.45
  risk_high: 0.70
  risk_critical: 0.85
  blink_rate_overload: 8.0
  blink_rate_fatigue: 22.0
  switch_dwell_seconds: 1.5
  re_engagement_stability: 3.0

intervention:
  cooldown_seconds: 120
  min_risk_to_trigger: 0.65
  delay_switch_ms: 1500

database:
  path: "data/cognitive_data.db"
  retention_days: 90
  feature_log_path: "data/feature_log.db"

model:
  weights_path: "data/lstm_weights.json"
  sequence_len: 30
  hidden_size: 64
  log_interval_sec: 2.0
  db_snapshot_sec: 5.0

personal_signature:
  rolling_window_days: 7
  min_sessions_for_profile: 3

multi_monitor:
  enabled: false
  secondary_yaw_zone: [-50, -20]